name: Haftalık etkinlik taraması

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 06:00 UTC (09:00 TSİ)
  workflow_dispatch:        # elle tetikleme (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python -m radar.run

      - name: Sonuçları commit'le
        run: |
          git config user.name "etkinlik-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ output/ docs/
          git diff --staged --quiet || git commit -m "Haftalık tarama: $(date +%Y-%m-%d)"
          git push
