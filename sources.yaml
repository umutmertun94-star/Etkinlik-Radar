# ============================================================
# Etkinlik Radarı — kaynak havuzu
# Yeni kaynak eklemek için kod değişikliği gerekmez.
# type: manual | confstech | rss | html | ddg
# ============================================================

# Tarama kuralları:
# - Yüz yüze etkinlikler yalnızca aşağıdaki ülkelerdeyse tutulur
#   (katılım imkânı). Online/webinar etkinlikler her yerden gelir.
# - istisna_kaynaklar bu kuraldan muaftır (elle eklenenler = bilinçli tercih).
rules:
  yuz_yuze_ulkeler: ["Turkey", "Türkiye"]
  istisna_kaynaklar: ["cekirdek-liste"]
  # Başlığında bu kurumlar geçen etkinlikler yurt dışı yüz yüze olsa da tutulur
  # (merkez bankası çalışanının resmi kanaldan katılabildiği kategori):
  istisna_kurumlar: ["BIS", "Bank for International Settlements", "IMF", "ECB",
                     "FSB", "World Bank", "OECD", "Basel Committee", "CPMI", "FSI"]

sources:

  # ---------- Çekirdek liste: kaçırılmaması gereken çapa etkinlikler ----------
  # Keşif katmanına bırakılamayacak kadar önemli büyük etkinlikler burada
  # elle tutulur. Yeni duyurulan bir GITEX/MWC/Web Summit tarihini buraya
  # ekleyin — bir sonraki taramada bülten ve dashboard'a girer.
  - id: cekirdek-liste
    type: manual
    events:
      - title: "GITEX Global 2026 (+ GITEX Scale Summit, Ai Everything)"
        url: https://www.gitex.com/
        category: yapay-zeka
        start_date: "2026-12-07"
        end_date: "2026-12-11"
        city: Dubai (Expo City)
        country: United Arab Emirates
        online: false
      - title: "13. SDMX Experts Workshop (TÜİK + OECD + TCMB ev sahipliğinde)"
        url: https://www.sdmxexperts2026.org/
        category: merkez-bankaciligi
        start_date: "2026-11-30"
        end_date: "2026-12-04"
        city: Ankara
        country: Türkiye
        online: false
      # Tekrarlayan seri: her ayın 3. çarşambası, YouTube canlı yayını
      - title: "TRAI Meet-Up (aylık yapay zeka buluşması)"
        url: https://turkiye.ai/trai-meet-up/
        category: yapay-zeka
        online: true
        recurring: {weekday: 2, ordinal: 3, months_ahead: 3}
      # örnek şablon:
      # - title: ""
      #   url: ""
      #   category: siber-guvenlik   # yapay-zeka|kuantum|veri-merkezi|ai-governance|merkez-bankaciligi|genel-bt
      #   start_date: "2026-MM-DD"
      #   end_date: "2026-MM-DD"     # tek günlükse silinebilir
      #   city: ""
      #   country: ""
      #   online: false              # webinar ise true

  # ---------- Açık veritabanları (kutudan çıktığı gibi çalışır) ----------
  - id: confstech
    type: confstech
    category: genel-bt
    topics: [security, data, devops, networking, iot, general]
    category_map:
      security: siber-guvenlik
      data: yapay-zeka
      networking: veri-merkezi

  # ---------- Küresel dizinler (Ağu 2026 dizin taraması) ----------
  # Techmeme Events: editör küratörlü tek sayfa, tüm büyük küresel
  # etkinlikler + VIRTUAL/HYBRID etiketleri. Türkiye filtresi yok ve
  # gerekmiyor: TR dışı yüz yüze etkinlikleri yukarıdaki yuz_yuze_ulkeler
  # kuralı zaten eler; online/hibrit olanlar + istisna_kurumlar kalır.
  # Bilinen açık: şehir bilgisi başlıkta gömülü geldiğinden country alanı
  # boş kalıyor, Seul/Riyad tipi yüz yüze etkinlikler sızabiliyor.
  # Geçici çözüm LLM filtre prompt'unda; kalıcı çözüm (başlıktan
  # şehir/VIRTUAL ayrıştırma) Claude Code seansında.
  - id: techmeme-events
    type: html
    enabled: true
    url: https://www.techmeme.com/events
    category: genel-bt
    selectors: {item: ".rhov", title: "a", link: "a", date: "div"}

  # ---------- Keşif katmanı: DuckDuckGo (anahtarsız) ----------
  # Sabit havuzun dışını yakalayan haftalık sorgular.
  - id: ddg-kesif
    type: ddg
    queries:
      # --- Türkiye'deki yüz yüze etkinlikler ---
      - {q: "yapay zeka konferansı 2026 İstanbul Ankara",      category: yapay-zeka, max: 8}
      - {q: "siber güvenlik konferansı 2026 Türkiye",          category: siber-guvenlik, max: 8}
      - {q: "teknoloji zirvesi 2026 İstanbul kayıt",           category: genel-bt, max: 6}
      - {q: "veri merkezi etkinlik 2026 Türkiye",              category: veri-merkezi, max: 5}
      # --- Webinarlar (dünyanın her yerinden) ---
      - {q: "central bank AI webinar 2026 register",            category: merkez-bankaciligi, max: 8}
      - {q: "CBDC payments webinar 2026",                       category: merkez-bankaciligi, max: 6}
      - {q: "post-quantum cryptography webinar 2026 register",  category: kuantum, max: 8}
      - {q: "AI governance webinar 2026 register",              category: ai-governance, max: 8}
      - {q: "cybersecurity financial sector webinar 2026",      category: siber-guvenlik, max: 6}
      - {q: "data center infrastructure webinar 2026",          category: veri-merkezi, max: 5}
      - {q: "Gartner webinar AI security banking",              category: genel-bt, max: 5}
      - {q: "BrightTALK webinar central banking fintech",       category: merkez-bankaciligi, max: 5}
      - {q: "enterprise IT webinar 2026 free registration",     category: genel-bt, max: 5}
      # --- Türkiye meetup/topluluk keşfi ---
      - {q: "TRAI yapay zeka meetup etkinlik",                  category: yapay-zeka, max: 6}
      - {q: "kommunity.com yapay zeka etkinlik Ankara İstanbul", category: yapay-zeka, max: 6}
      - {q: "site:brighttalk.com webinar central bank fintech", category: merkez-bankaciligi, max: 6}
      # Gartner: /en/webinar path'li site: sorgusu boş dönüyordu; hub JS ile
      # yükleniyor. Tekil webinar sayfalarını hedefleyen iki sorguyla değiştirildi:
      - {q: "site:gartner.com webinar AI security 2026 register",  category: genel-bt, max: 6}
      - {q: "complimentary Gartner webinar AI governance",         category: ai-governance, max: 5}
      # --- Haber kaynağı listesindeki etkinlik düzenleyen kuruluşlar ---
      - {q: "site:omfif.org meeting OR seminar OR roundtable 2026", category: merkez-bankaciligi, max: 6}
      - {q: "site:centralbanking.com events OR training",           category: merkez-bankaciligi, max: 6}
      - {q: "site:finextra.com webinar",                            category: merkez-bankaciligi, max: 6}
      - {q: "site:fintechfutures.com webinar",                      category: merkez-bankaciligi, max: 5}
      - {q: "site:thequantuminsider.com event OR conference",       category: kuantum, max: 5}
      - {q: "site:cepa.org event 2026",                             category: ai-governance, max: 4}
      - {q: "site:technologyreview.com EmTech 2026",                category: yapay-zeka, max: 4}
      - {q: "site:bis.org meeting OR conference 2026",              category: merkez-bankaciligi, max: 5}
      # --- İstatistik / veri standartları (SDMX dersinden) ---
      - {q: "SDMX conference workshop 2026",                        category: merkez-bankaciligi, max: 5}
      - {q: "official statistics data standards conference 2026",   category: merkez-bankaciligi, max: 5}
      - {q: "central bank statistics data governance workshop",     category: merkez-bankaciligi, max: 4}
      - {q: "site:sdmx.io event",                                   category: merkez-bankaciligi, max: 4}
      # --- Dizin taraması eklemeleri (Ağu 2026) ---
      - {q: "site:protokol.org.tr etkinlik teknoloji yapay zeka",   category: genel-bt, max: 5}
      - {q: "site:suerf.org webinar OR conference 2026",            category: merkez-bankaciligi, max: 6}
      - {q: "site:digital-euro-association.de events",              category: merkez-bankaciligi, max: 4}
      - {q: "site:iapp.org web conference AI governance",           category: ai-governance, max: 5}
      # lu.ma: site: kalıbı DDG'de boş dönüyor → düz sorguya çevrildi
      - {q: "lu.ma Istanbul AI meetup etkinlik",                    category: yapay-zeka, max: 6}
      - {q: "lu.ma Ankara yapay zeka teknoloji",                    category: yapay-zeka, max: 5}
      - {q: "ETSI IQC quantum safe cryptography workshop 2026",     category: kuantum, max: 4}
      - {q: "site:iqtevent.com",                                    category: kuantum, max: 4}
      - {q: "FinTech İstanbul etkinlik duyuru",                     category: merkez-bankaciligi, max: 5}
      - {q: "ISC Turkey siber güvenlik konferansı Ankara",          category: siber-guvenlik, max: 4}
      - {q: "Siber Güvenlik Kümelenmesi etkinlik",                  category: siber-guvenlik, max: 4}

  # ---------- Google Alerts (RSS) ----------
  # Kurulum: google.com/alerts → sorgu oluştur → "Teslim: RSS özet akışı"
  # → çıkan feed linkini url alanına yapıştır → enabled: true yap.
  - id: alerts-yz-konferans
    type: rss
    enabled: false
    url: "BURAYA_ALERTS_RSS_LINKI"
    category: yapay-zeka
  - id: alerts-kuantum
    type: rss
    enabled: false
    url: "BURAYA_ALERTS_RSS_LINKI"
    category: kuantum

  # ---------- Merkez bankacılığına özgü kaynaklar ----------
  # HTML kaynaklarında selectors alanı siteye göre ayarlanmalı
  # (ilk çalıştırmada sayfa yapısına bakıp doldurun / bana sorun).
  - id: bis-events
    type: html
    enabled: false
    url: https://www.bis.org/events/index.htm
    category: merkez-bankaciligi
    selectors: {item: ".item", title: "a", link: "a", date: ".date"}
  - id: suerf-events
    type: html
    enabled: false
    url: https://www.suerf.org/events/
    category: merkez-bankaciligi
    selectors: {item: ".event", title: "a", link: "a", date: ".date"}
  # OMFIF: etkinlik listesi /events/ değil /meetings/ altında (doğrulandı).
  - id: omfif-events
    type: html
    enabled: false
    url: https://www.omfif.org/meetings/
    category: merkez-bankaciligi
    selectors: {item: ".event-card", title: "h3", link: "a", date: ".date"}

  # ---------- Türkiye ----------
  # Topluluk slug'ları kommunity.com'da topluluğun adres çubuğundan alınır
  # (kommunity.com/<slug>). Yenilerini listeye ekleyin yeter.
  # TRAI kommunity'de değil (Meetup + turkiye.ai kullanıyorlar; çekirdek
  # listeye tekrarlayan seri olarak eklendi). Başka TR toplulukları
  # eklemek isterseniz slug'larıyla birlikte bu kaynağı açın.
  - id: kommunity
    type: kommunity
    enabled: false
    category: yapay-zeka
    communities:
      - turkiye-yapay-zeka-inisiyatifi   # TRAI — slug'ı adres çubuğundan doğrulayın
      # - ankara-ai                       # örnek: başka topluluklar buraya

  # ---------- Vendor / analist webinarları ----------
  # Aşağıdakiler webinar yoğun platformlar; CSS seçicileri Claude Code ile
  # site site ayarlanacak (bazıları JS ağırlıklı, uyarlama gerekebilir).
  # BrightTALK: her kanalın RSS'i vardır → kanal sayfasındaki numarayı alın,
  # https://www.brighttalk.com/channel/<KANAL_NO>/feed adresini url'e yazın,
  # enabled: true yapın. (Önerilen kanallar: central banking, cyber, AI konulu
  # olanlar — kanal numaralarını siteden bakıp ekleyeceğiz.)
  - id: brighttalk-ornek-kanal
    type: rss
    enabled: false
    url: "https://www.brighttalk.com/channel/KANAL_NO/feed"
    category: merkez-bankaciligi

  # Gartner webinar hub'ı JS ile yükleniyor — basit HTML fetcher boş görür.
  # Kalıcı çözüm (arkadaki JSON ucunu bulup bağlamak) Claude Code seansında;
  # o zamana kadar Gartner'ı yukarıdaki iki DDG sorgusu taşıyor.
  - id: gartner-webinars
    type: html
    enabled: false
    url: https://www.gartner.com/en/webinars
    category: genel-bt
    selectors: {item: ".webinar-card", title: "a", link: "a", date: ".date"}
  - id: sans-webcasts
    type: html
    enabled: false
    url: https://www.sans.org/webcasts/
    category: siber-guvenlik
    selectors: {item: ".webcast-item", title: "a", link: "a", date: ".date"}
  - id: enisa-events
    type: html
    enabled: false
    url: https://www.enisa.europa.eu/events
    category: siber-guvenlik
    selectors: {item: ".event", title: "a", link: "a", date: ".date"}
